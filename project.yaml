# How the factory ships this project (software-factory docs/design.md §9).
apiVersion: factory/v2
name: jkrumm.com
deploy:
  mode: make # a push to master deploys via CI (RollHook); `make version` reads the live build commit, `make verify` probes the site
  targets:
    - { name: vps, host: vps, verify: make verify }
  hold: 10m # CI build + rolling swap takes a few minutes
  migrations: []
ship:
  - { paths: ['**'], via: push }
leads: 1
signals:
  github:
    author: jkrumm
    since: 2026-11-07T06:30:00Z # cut-over: only issues the owner opens after this come in
